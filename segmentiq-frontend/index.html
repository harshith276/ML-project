<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SegmentIQ — Privacy-first customer segmentation powered by local AI. RFM analysis, K-Means clustering, and plain-English queries via Ollama." />
    <title>SegmentIQ — Customer Intelligence Platform</title>

    <!-- Google Fonts: Inter (body) + Space Grotesk (headings) -->
    <!-- Loaded via <link> not @import for faster critical path -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Apply saved theme BEFORE React mounts to prevent flash -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || theme === 'system' && prefersDark || (!theme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
